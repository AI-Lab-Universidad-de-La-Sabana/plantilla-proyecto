[project]
name = "nombre-proyecto"
version = "0.1.0"
description = "Descripción de una línea del proyecto."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

# --- Ruff: formato y lint ----------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F",  # errores básicos
    "I",            # orden de imports
    "B",            # errores probables
    "UP",           # sintaxis moderna
    "S",            # seguridad (bandit)
    "SIM",          # simplificaciones
    "RUF",          # reglas propias de ruff
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert está permitido en pruebas
"evals/**" = ["S101"]

# --- mypy: tipos -------------------------------------------------------------
[tool.mypy]
files = ["src"]
strict = true
plugins = ["pydantic.mypy"]

# --- pytest y cobertura ------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
