# Hooks de git: se activan con `make setup`.
#   - Antes de cada commit: secretos, formato, lint y bloqueo de commits en `main`.
#   - Antes de cada push: bloqueo de push directo a `main`.
# En GitHub Free los repositorios privados no protegen `main` en el servidor: estos hooks son la
# primera barrera y la auditoría de CI la segunda. No los saltes con --no-verify.
# Actualizar versiones: uvx pre-commit autoupdate
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks          # bloquea commits con secretos [SEG-01]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: no-commit-to-branch   # trabaja en una rama, nunca en main [FLU-02]
        args: ["--branch", "main"]
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: local
    hooks:
      - id: bloquear-push-main
        name: bloquear push directo a main
        language: system
        entry: bash .github/scripts/bloquear-push-main.sh
        stages: [pre-push]
        always_run: true
        pass_filenames: false
