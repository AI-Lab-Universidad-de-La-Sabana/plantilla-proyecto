# CI estándar del AiLab, pensado para GitHub Free (2.000 minutos/mes para repositorios privados).
# Un solo job: GitHub cobra cada job redondeando al minuto, así que separar pasos en jobs cuesta más.
# Las acciones están fijadas por SHA; Dependabot las actualiza.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read # auditoría de main: leer PR y aprobaciones
      issues: write # auditoría de main: abrir un issue si algo no siguió el flujo
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # historial completo: un secreto borrado sigue expuesto
          persist-credentials: false

      - name: Convenciones (nombre de rama y título del PR)
        if: github.event_name == 'pull_request'
        env:
          RAMA: ${{ github.head_ref }}
          TITULO: ${{ github.event.pull_request.title }}
        run: bash .github/scripts/validar-convenciones.sh "$RAMA" "$TITULO"

      - name: Secretos (gitleaks)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/gitleaks.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --verbose .

      - name: Instalar uv (Python)
        if: hashFiles('pyproject.toml') != ''
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Instalar pnpm (TypeScript)
        if: hashFiles('package.json') != ''
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar Node (TypeScript)
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias
        run: make install

      - name: make check
        run: make check

      # GitHub Free no protege `main` en repositorios privados: verificamos después de cada push
      # que todo haya llegado por un PR aprobado por otra persona. Si no, se abre un issue.
      - name: Auditoría de main
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/auditar-main.sh
